name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only token: CI never pushes, comments or deploys.
permissions:
  contents: read

# A newer push to the same PR/branch cancels the run it supersedes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  check:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint + typecheck + unit tests
        run: npm run check
      - name: Production build
        run: npm run build

  integration:
    name: PostgreSQL, Shopify connect flow (simulated), responsive
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agent_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agent_ci?schema=public
      # Throwaway values for the SIMULATED Shopify (e2e/fake-shopify-preload.mjs) — not real
      # credentials. The fake only loads for a store domain ending in "-e2e.myshopify.com".
      APP_URL: http://localhost:3101
      SHOPIFY_CLIENT_ID: ci-e2e-client-id
      SHOPIFY_CLIENT_SECRET: ci-e2e-fake-client-secret
      SHOPIFY_STORE_DOMAIN: ci-store-e2e.myshopify.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Apply migrations to a fresh database
        run: npx prisma migrate deploy
      - name: Schema matches the migrations (no drift)
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - name: Seed script runs against the migrated schema
        run: npm run db:seed
      - name: PostgreSQL tests (refresh lease, token-refresh concurrency, revoke, CHECK constraints)
        run: npx vitest run src/server/store/prisma-connections.test.ts src/server/integrations/shopify/connection.pg.test.ts
        env:
          TEST_DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Production build
        run: npm run build
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Shopify connect flow (simulated Shopify) + Basic Auth gate
        env:
          # Production-like: the dashboard password is on. Throwaway test value.
          DASHBOARD_BASIC_AUTH_USER: ci-owner
          DASHBOARD_BASIC_AUTH_PASSWORD: ci-throwaway-basic-auth-password
        run: |
          export CREDENTIALS_ENCRYPTION_KEY="$(openssl rand -base64 32)"
          export BASIC_AUTH="${DASHBOARD_BASIC_AUTH_USER}:${DASHBOARD_BASIC_AUTH_PASSWORD}"
          E2E_FAKE_SHOPIFY=1 E2E_FAKE_SHOPIFY_LOG="$RUNNER_TEMP/fake-shopify.log" \
            NODE_OPTIONS="--import ./e2e/fake-shopify-preload.mjs" \
            npx next start -p 3101 > "$RUNNER_TEMP/server-shopify.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3101/api/health > /dev/null && break; sleep 1; done
          BASE_URL=http://localhost:3101 npm run test:shopify-flow
          # Every page, dotted path, server action and API route needs the password.
          BASE_URL=http://localhost:3101 npm run test:auth-gate
          # The server must never log a token, a secret or an authorization code…
          if grep -E "shpat_|shprt_|e2e_code_|${SHOPIFY_CLIENT_SECRET}|${DASHBOARD_BASIC_AUTH_PASSWORD}" "$RUNNER_TEMP/server-shopify.log"; then
            echo "::error::A token, secret or authorization code appeared in the server log"; exit 1
          fi
          # …and must never send a mutation to Shopify.
          if grep -q '"mutation":true' "$RUNNER_TEMP/fake-shopify.log"; then
            echo "::error::A GraphQL mutation was sent to Shopify"; exit 1
          fi
          kill %1 || true

      - name: Production fails closed without valid dashboard credentials
        run: |
          # Wait for any HTTP answer: a fail-closed server's health probe is (correctly) 503.
          wait_up() { for i in $(seq 1 60); do curl -s -o /dev/null "http://localhost:$1/api/health" && return 0; sleep 1; done; return 1; }
          # 1) credentials missing entirely
          env -u SHOPIFY_CLIENT_ID npx next start -p 3200 > "$RUNNER_TEMP/server-no-auth.log" 2>&1 &
          wait_up 3200
          BASE_URL=http://localhost:3200 EXPECT=fail-closed npm run test:auth-gate
          # 2) invalid credentials (password too short)
          DASHBOARD_BASIC_AUTH_USER=ci-owner DASHBOARD_BASIC_AUTH_PASSWORD=tooShort9x npx next start -p 3201 > "$RUNNER_TEMP/server-bad-auth.log" 2>&1 &
          wait_up 3201
          BASE_URL=http://localhost:3201 EXPECT=fail-closed npm run test:auth-gate
          if grep -h "tooShort9x" "$RUNNER_TEMP/server-bad-auth.log"; then echo "::error::The password value appeared in the log"; exit 1; fi
          # 3) a production build started with a non-production NODE_ENV, no credentials:
          #    still closed (open mode needs DASHBOARD_AUTH_DISABLED=1 AND `next dev`)
          NODE_ENV=test DASHBOARD_AUTH_DISABLED=1 npx next start -p 3202 > "$RUNNER_TEMP/server-test-env.log" 2>&1 &
          wait_up 3202
          BASE_URL=http://localhost:3202 EXPECT=fail-closed npm run test:auth-gate
          kill %1 %2 %3 || true

      - name: Responsive + PWA smoke test (demo data, behind the dashboard password, 9 viewports × 2 languages)
        env:
          DASHBOARD_BASIC_AUTH_USER: ci-owner
          DASHBOARD_BASIC_AUTH_PASSWORD: ci-throwaway-basic-auth-password
        run: |
          env -u DATABASE_URL -u SHOPIFY_CLIENT_ID -u SHOPIFY_CLIENT_SECRET -u SHOPIFY_STORE_DOMAIN -u APP_URL \
            npx next start -p 3000 > "$RUNNER_TEMP/server-demo.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/api/health > /dev/null && break; sleep 1; done
          BASE_URL=http://localhost:3000 BASIC_AUTH="${DASHBOARD_BASIC_AUTH_USER}:${DASHBOARD_BASIC_AUTH_PASSWORD}" npm run test:responsive
          kill %1 || true

      - name: Upload server logs (only fake test values)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-logs
          path: ${{ runner.temp }}/*.log
          retention-days: 7
          if-no-files-found: ignore
